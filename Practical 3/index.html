<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grading System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. LOGIN SECTION (Visible by default) -->
    <div class="container" id="loginCard">
        <h1>🔒Portal Login</h1>
        
        <label>PRN (Roll Number)</label>
        <input type="text" id="prn" placeholder="Enter PRN (e.g., 24070521056)">
        
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter Password">
        
        <button onclick="handleLogin()">Login</button>
        
        <footer>
            Designed by <b>Harman Saini (24070521056)</b>
        </footer>
    </div>

    <!-- 2. GRADING SYSTEM SECTION (Hidden by default) -->
    <div class="container" id="gradingCard" style="display: none;">
        <h1>🎓 Student Grading System</h1>
        
        <label>Student Name</label>
        <input type="text" id="name" placeholder="Enter Student Name">
        
        <label>Marks (0-100)</label>
        <input type="number" id="marks" placeholder="Enter Marks">
        
        <button onclick="gradeSystem()">Generate Grade</button>
        
        <div id="output" style="display: none;"></div>
        
        <button onclick="handleLogout()" class="btn-logout" style="margin-top: 15px; background: #6c757d;">Logout</button>
        
        <footer>
            Designed by <b>Harman Saini (24070521056)</b>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
